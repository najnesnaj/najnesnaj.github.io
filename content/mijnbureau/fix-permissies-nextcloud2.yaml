apiVersion: v1
kind: Pod
metadata:
  name: fix-nextcloud-root
  namespace: default
spec:
  securityContext:
    runAsUser: 0  # Forceer root-rechten
  containers:
  - name: fixer
    image: busybox
    command: ["sh", "-c"]
    args:
      - |
        echo "Huidige rechten:"
        ls -ld /data/config
        echo "Rechten aanpassen naar gebruiker 1001..."
        chown -R 1001:1001 /data
        chmod -R 755 /data
        echo "Klaar. Nieuwe situatie:"
        ls -ld /data/config
    volumeMounts:
    - name: storage
      mountPath: /data
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: nextcloud  # De naam uit jouw 'kubectl get pvc'
  restartPolicy: Never

