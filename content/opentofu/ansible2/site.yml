---
# Configure the k8s-management container (Proxmox LXC 105): the SSH server,
# the admin login, and the Talos/Kubernetes tooling (including the talosctl
# client configuration and the admin kubeconfig for the control plane).
#
#   ansible-playbook site.yml
#
# Credentials and target address come from the inventory; see README.md.
- name: Configure SSH server and tooling on k8s-management
  hosts: k8s_management
  become: true
  gather_facts: true

  roles:
    - ssh_server
    - tools
    - talos_client
    - kubeconfig

  post_tasks:
    - name: Verify talosctl is installed
      ansible.builtin.command: talosctl version --client --short
      register: verify_talosctl
      changed_when: false

    - name: Read the effective talosctl context
      ansible.builtin.command: /usr/local/bin/talosctl config info -o json
      register: verify_talosctl_config
      changed_when: false

    - name: Assert talosctl targets the Talos control plane
      ansible.builtin.assert:
        that:
          - talos_endpoint_ip in (verify_talosctl_config.stdout | from_json).endpoints
          - talos_node_ip in (verify_talosctl_config.stdout | from_json).nodes
        success_msg: "talosctl: control plane endpoint/node {{ talos_endpoint_ip }} configured"
        fail_msg: "talosctl is not configured for the control plane {{ talos_endpoint_ip }}"

    - name: Probe the Talos control plane API (non-fatal)
      # A reachability probe only; the control plane may be rebuilt independently
      # of the client configuration, so this must not fail the playbook.
      ansible.builtin.command: /usr/local/bin/talosctl -n {{ talos_endpoint_ip }} version
      register: verify_talosctl_api
      changed_when: false
      failed_when: false

    - name: Verify kubectl is installed
      ansible.builtin.command: kubectl version --client -o json
      register: verify_kubectl
      changed_when: false

    - name: Read the effective kubeconfig
      ansible.builtin.command: >-
        /usr/local/bin/kubectl config view --minify -o
        jsonpath={.clusters[0].cluster.server}
      register: verify_kubeconfig
      changed_when: false

    - name: Assert kubectl uses the managed kubeconfig
      ansible.builtin.assert:
        that:
          - verify_kubeconfig.stdout == 'https://' ~ kube_api_endpoint ~ ':6443'
        success_msg: "kubectl: kubeconfig server {{ verify_kubeconfig.stdout }}"
        fail_msg: "kubectl kubeconfig is not pointed at {{ kube_api_endpoint }}:6443"

    - name: Probe the Kubernetes API (non-fatal)
      # The cluster API server may be down (or being rebuilt) independently of
      # the client configuration, so this must not fail the playbook.
      ansible.builtin.command: /usr/local/bin/kubectl get nodes --request-timeout=5s
      register: verify_kubectl_api
      changed_when: false
      failed_when: false

    - name: Verify the effective sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: verify_sshd
      changed_when: false

    - name: Assert interactive password authentication is disabled
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in verify_sshd.stdout | lower"
          - "'permitrootlogin prohibit-password' in verify_sshd.stdout | lower"
        success_msg: "sshd: key-only logins, root restricted to keys"
        fail_msg: "sshd hardening is not in effect"

    - name: Report the configured versions
      ansible.builtin.debug:
        msg:
          - "talosctl: {{ verify_talosctl.stdout_lines | join(' ') }}"
          - "kubectl:  {{ (verify_kubectl.stdout | from_json).clientVersion.gitVersion }}"
          - "login:    {{ admin_user }} (sudo, key-based)"
          - >-
            talosctl:  context {{ (verify_talosctl_config.stdout | from_json).context }},
            endpoint {{ (verify_talosctl_config.stdout | from_json).endpoints | join(',') }},
            node {{ (verify_talosctl_config.stdout | from_json).nodes | join(',') }}
          - "talosctl:  control plane {{ talos_endpoint_ip }} reachable = {{ verify_talosctl_api.rc == 0 }}"
          - "kubectl:   kubeconfig {{ kubeconfig_file }} (server {{ verify_kubeconfig.stdout }})"
          - "kubectl:   Kubernetes API reachable = {{ verify_kubectl_api.rc == 0 }}"


