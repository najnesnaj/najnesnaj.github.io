# Ansible control-node configuration for the k8s-management LXC container.
#
# The inventory targets the container's DHCP address on the home network
# (vmbr0). If the lease changes, update `ansible_host` in hosts.yml or run
# `ansible/refresh-inventory.sh` to regenerate it from the OpenTofu state.
[defaults]
inventory = hosts.yml
retry_files_enabled = False
interpreter_python = auto_silent
private_key_file = ~/.ssh/id_ed25519

# The container is recreated from the Ubuntu template, so its host key is not
# known in advance. Populate ~/.ssh/known_hosts and set this to True if you
# prefer strict verification.
host_key_checking = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
