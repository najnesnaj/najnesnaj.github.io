---
# Configure the SSH server and the login that Ansible (and the operator) uses
# to reach k8s-management.

- name: Ensure openssh-server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure ssh service is enabled and running
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

- name: Create admin login "{{ admin_user }}"
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ admin_groups }}"
    append: true
    shell: "{{ admin_shell }}"
    create_home: true
    state: present
  register: admin_account

- name: Install the control-node public key for "{{ admin_user }}"
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_public_key }}"
    state: present
    manage_dir: true

- name: Install additional public keys for "{{ admin_user }}"
  # Keys for other servers/operators (no local `jan` account required on them).
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ item }}"
    state: present
    manage_dir: true
    exclusive: "{{ ssh_authorized_keys_exclusive }}"
  loop: "{{ ssh_extra_authorized_keys }}"
  when: ssh_extra_authorized_keys | length > 0

- name: Ensure "{{ admin_user }}" owns its home directory contents
  # The container template / previous bootstrap may have created the home
  # directory as root; sshd refuses key auth when ~/.ssh is not owned by the
  # login, so enforce ownership here (idempotent).
  ansible.builtin.file:
    path: "{{ admin_account.home }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    recurse: true

- name: Keep the control-node public key for root (Terraform bootstrap access)
  ansible.posix.authorized_key:
    user: root
    key: "{{ admin_public_key }}"
    state: present
    manage_dir: true

- name: Grant passwordless sudo to "{{ admin_user }}"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Configure sshd (drop-in)
  ansible.builtin.template:
    src: sshd_config.d/99-k8s-management.conf.j2
    dest: "{{ sshd_dropin }}"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart ssh

- name: Apply sshd changes before the tools role runs
  ansible.builtin.meta: flush_handlers
