apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: local-path-backup
  namespace: backup
  labels:
    app.kubernetes.io/name: local-path-backup
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-backup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-path-backup
    spec:
      hostNetwork: false
      tolerations:
        - operator: Exists
      containers:
        - name: restic
          image: restic/restic:0.18.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              export RESTIC_REPOSITORY="s3:http://10.10.50.2:3900/restic"
              export AWS_DEFAULT_REGION="garage"
              export RESTIC_CACHE_DIR="/tmp/restic-cache"
              mkdir -p "$RESTIC_CACHE_DIR"
              r() { restic -o s3.bucket-lookup=path "$@"; }

              echo "waiting for restic repository"
              until r snapshots >/dev/null 2>&1; do
                echo "repository not ready; retrying in 10s"
                sleep 10
              done

              # Spread simultaneous node uploads so they do not all prune at once.
              sleep $(( $(date +%s) % 300 ))

              while true; do
                echo "backup start $(date -u +%FT%TZ) host=${NODE_NAME}"
                if ! r backup /data \
                  --host "$NODE_NAME" \
                  --tag local-path \
                  --exclude '*/lost+found' \
                  --exclude '*/restic-cache'; then
                  echo "backup failed; will retry next cycle"
                fi
                if ! r forget \
                  --host "$NODE_NAME" \
                  --tag local-path \
                  --keep-daily 30 \
                  --keep-weekly 8 \
                  --keep-monthly 6 \
                  --prune; then
                  echo "forget/prune failed; will retry next cycle"
                fi
                echo "backup cycle done $(date -u +%FT%TZ) host=${NODE_NAME}"
                sleep 86400
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: restic-credentials
          volumeMounts:
            - name: local-path
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
      volumes:
        - name: local-path
          hostPath:
            path: /var/local-path-provisioner
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
