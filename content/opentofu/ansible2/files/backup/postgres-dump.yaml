apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-dumps
  namespace: euro-office
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump
  namespace: euro-office
spec:
  schedule: "30 1 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: postgresql.euro-office.svc.cluster.local
                - name: PGUSER
                  value: postgres
                - name: PGDATABASE
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  set -eu
                  mkdir -p /dumps
                  OUT="/dumps/postgres-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  pg_dumpall --clean --if-exists | gzip > "$OUT"
                  test -s "$OUT"
                  # Keep two weeks of logical dumps in addition to the physical
                  # local-path snapshot taken by the restic DaemonSet.
                  find /dumps -name 'postgres-*.sql.gz' -mtime +14 -delete
                  ls -lh /dumps | tail -5
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: postgres-dumps
