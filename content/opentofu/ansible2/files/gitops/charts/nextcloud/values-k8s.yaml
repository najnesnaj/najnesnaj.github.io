# Nextcloud on the Talos homelab cluster.
#
# Upstream chart: https://nextcloud.github.io/helm/ (chart 8.3.0, app 32.0.0)
#
# Adaptations for this cluster:
#   * Traefik instead of NGINX Ingress
#   * HTTP only (no cert-manager / Let's Encrypt)
#   * external PostgreSQL in the euro-office namespace
#   * `local-path` StorageClass for the Nextcloud data volume
#   * admin credentials read from the `nextcloud-admin` Secret

image:
  repository: nextcloud
  flavor: apache

replicaCount: 1

# Expose Nextcloud through a fixed NodePort so the UI is reachable from outside
# the cluster via any Talos node IP (e.g. http://10.10.50.10:30030).
service:
  type: NodePort
  nodePort: 30030

ingress:
  enabled: true
  className: traefik
  annotations: {}
  path: /
  pathType: Prefix

nextcloud:
  host: nextcloud.kubernetes.local
  # Nextcloud rejects any HTTP Host not listed here with "Access through
  # untrusted domain" (HTTP 400). Cover every way this homelab reaches it:
  # the Ingress vhost, Talos node IPs/hostnames, and LAN/forwarded addresses.
  trustedDomains:
    - nextcloud.kubernetes.local
    - 10.10.50.10
    - 10.10.50.21
    - 10.10.50.22
    - talos-node-1
    - talos-node-2
    - talos-node-3
    - 192.168.0.192
    - 192.168.0.201
    - 192.168.0.250
    - nextcloud.gridzig.com
  # NEXTCLOUD_TRUSTED_DOMAINS is only applied on first install. A later-loaded
  # config file keeps these hosts trusted after every pod recreation.
  configs:
    zz-trusted-domains.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_domains' =>
        array (
          0 => 'nextcloud.kubernetes.local',
          1 => '10.10.50.10',
          2 => '10.10.50.21',
          3 => '10.10.50.22',
          4 => 'talos-node-1',
          5 => 'talos-node-2',
          6 => 'talos-node-3',
          7 => '192.168.0.192',
          8 => '192.168.0.201',
          9 => '192.168.0.250',
          10 => 'nextcloud.gridzig.com',
        ),
      );
    # Force all generated URLs and browser traffic to HTTPS behind the public
    # reverse proxy / Traefik TLS terminator for nextcloud.gridzig.com.
    zz-https.config.php: |-
      <?php
      $CONFIG = array (
        'overwriteprotocol' => 'https',
        'overwrite.cli.url' => 'https://nextcloud.gridzig.com',
      );
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: username
    passwordKey: password
  update: 0
  datadir: /var/www/html/data

persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 5Gi

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: postgresql.euro-office.svc.cluster.local
  database: nextcloud
  user: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db
    usernameKey: username
    passwordKey: password

mariadb:
  enabled: false
postgresql:
  enabled: false
redis:
  enabled: false
collabora:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
