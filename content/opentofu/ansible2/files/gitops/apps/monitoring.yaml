apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.17.0
    helm:
      releaseName: monitoring
      values: |
        # The chart bundles Prometheus, Alertmanager, Grafana, the operator,
        # kube-state-metrics and node-exporter. Keep the footprint modest; the
        # Talos nodes have 2 GiB of RAM each.
        grafana:
          enabled: true
          adminUser: admin
          admin:
            # Stable admin credentials live in a Kubernetes Secret outside
            # Git. The chart-generated secret can be regenerated by Helm
            # renders and then no longer matches the password in Grafana's DB.
            existingSecret: monitoring-grafana-admin
          defaultDashboardsTimezone: Europe/Brussels
          # SQLite migrations must not run in two Grafana pods at the same
          # time. Recreate stops the old pod before the new one starts.
          deploymentStrategy:
            type: Recreate
          persistence:
            enabled: true
            type: pvc
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            size: 2Gi
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.kubernetes.local
            path: /
            pathType: Prefix
            tls: []
          grafana.ini:
            server:
              root_url: http://grafana.kubernetes.local
              serve_from_sub_path: false
            analytics:
              reporting_enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        alertmanager:
          enabled: true
          alertmanagerSpec:
            retention: 120h
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi

        prometheus:
          enabled: true
          prometheusSpec:
            retention: 7d
            retentionSize: 6GB
            scrapeInterval: 30s
            evaluationInterval: 30s
            # local-path stores the Prometheus data below a subPath that the
            # kubelet creates as root. fsGroup alone does not fix ownership of
            # that subPath, so make it writable for the Prometheus UID before
            # the server starts.
            initContainers:
              - name: init-chown-data
                image: docker.io/library/busybox:1.38.0
                command:
                  - sh
                  - -c
                  - chown -R 1000:2000 /prometheus
                securityContext:
                  runAsUser: 0
                  runAsGroup: 0
                  runAsNonRoot: false
                volumeMounts:
                  - name: prometheus-monitoring-kube-prometheus-prometheus-db
                    mountPath: /prometheus
                    subPath: prometheus-db
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 8Gi
            # Pick up the ServiceMonitors and PodMonitors that the chart
            # installs (the defaults only select objects with the Helm release
            # label).
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

        prometheusOperator:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

        kubeStateMetrics:
          enabled: true
        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

        nodeExporter:
          enabled: true
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        # Talos does not run the usual static control-plane pods. The API
        # server and kubelet are scraped, but etcd, controller-manager,
        # scheduler and kube-proxy are not exposed as cluster services.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
