apiVersion: v1
kind: Namespace
metadata:
  name: nginx-demo
  labels:
    app.kubernetes.io/part-of: nginx-demo
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-welcome
  namespace: nginx-demo
  labels:
    app.kubernetes.io/part-of: nginx-demo
data:
  index.html: |
    <!doctype html>
    <html lang="nl">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>nginx demo — ArgoCD</title>
      <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          font-family: system-ui, -apple-system, sans-serif;
          background: radial-gradient(circle at top, #1f6feb33, #0d1117 55%);
          color: #e6edf3;
        }
        main {
          padding: 2rem 3rem;
          border: 1px solid #30363d;
          border-radius: 1rem;
          background: #161b22cc;
          text-align: center;
        }
        h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 6vw, 3.5rem); }
        p { margin: .5rem 0; color: #9da7b3; }
        code { color: #79c0ff; }
      </style>
    </head>
    <body>
      <main>
        <h1>Welkom bij de nginx-demo</h1>
        <p>Deze pagina komt uit <strong>Forgejo</strong> en is uitgerold door <strong>ArgoCD</strong>.</p>
        <p><code>apps/nginx-demo/app.yaml</code> — namespace <code>nginx-demo</code></p>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx-demo
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/part-of: nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-demo
        app.kubernetes.io/part-of: nginx-demo
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: welcome
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: welcome
          configMap:
            name: nginx-welcome
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx-demo
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/part-of: nginx-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: nginx-demo
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/part-of: nginx-demo
spec:
  ingressClassName: traefik
  rules:
    - host: nginx-demo.kubernetes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: http
