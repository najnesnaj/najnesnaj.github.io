apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: euro-office
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: office
spec:
  project: default
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/gitea_admin/gitops.git
    targetRevision: HEAD
    path: charts/euro-office-docs
    helm:
      releaseName: documentserver
      valueFiles:
        - values-k8s.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: euro-office
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
