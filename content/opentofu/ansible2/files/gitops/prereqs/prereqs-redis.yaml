# Redis for Euro-Office Docs.
# The chart expects a service named `redis-master` and a secret named `redis`
# with the key `redis-password`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: euro-office
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: euro-office
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: euro-office
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD" --save "" --appendonly no
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: euro-office
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: euro-office
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
