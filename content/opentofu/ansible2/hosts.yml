---
# Inventory for the k8s-management management container (Proxmox LXC 105).
#
# `ansible_host` is the container's eth0 address on the home network (DHCP,
# assigned by the physical router). It is NOT the 10.10.50.10 address: that one
# lives on the isolated vmbr1 bridge and is only reachable from inside the
# Talos subnet.
#
# Example: refresh the DHCP address straight from the OpenTofu state before a
# run, then pass it with `-e`:
#
#   ansible-playbook site.yml \
#     -e "ansible_host=$(cd .. && tofu output -json management | jq -r .wan_ips.eth0)"
#
all:
  children:
    k8s_management:
      hosts:
        k8s-management:
          ansible_host:  192.168.0.201
          ansible_user: root
