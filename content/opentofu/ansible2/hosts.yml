---
# Inventory for the k8s-management management container (Proxmox LXC 105).
#
# `ansible_host` is the container's eth0 address on the home network (DHCP,
# assigned by the physical router). It is NOT the 10.10.50.10 address: that one
# lives on the isolated vmbr1 bridge and is only reachable from inside the
# Talos subnet.
#
# The OpenTofu state can be stale after a DHCP change. Check LXC 105 in the
# Proxmox UI (or `ip -4 -o addr show eth0` on the container) and pass the
# current address:
#
#   ansible-playbook site.yml -e "ansible_host=<current-address>"
#
all:
  children:
    k8s_management:
      hosts:
        k8s-management:
          ansible_host:  192.168.0.192
          ansible_user: root
